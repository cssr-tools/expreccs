name: Run expreccs

on:
 pull_request:
   
jobs:
  run-expreccs-local:
    permissions:
      contents: read
    timeout-minutes: 60
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v5

    - name: Install Flow Simulator
      run: |
        sudo apt-get update
        sudo apt-get install software-properties-common
        sudo apt-add-repository ppa:opm/ppa
        sudo apt-get update
        sudo apt-get install mpi-default-bin libopm-simulators-bin

    - name: Install optional (but recommended) plotting (LaTeX) dependencies
      run: |
        sudo apt-get install texlive-fonts-recommended texlive-fonts-extra dvipng cm-super
        
    - name: Install expreccs and python requirements
      run: |
        python3 -m venv vexpreccs
        . vexpreccs/bin/activate
        echo "$PWD/vexpreccs/bin" >> $GITHUB_PATH
        pip install --upgrade pip setuptools wheel
        pip install -e .
        pip install -r dev-requirements.txt
        
    - name: Check code style and linting 
      run: |
        black --target-version py314 src/ tests/ examples/ publications/ tccs-13/ --check
        pylint src/ tests/ examples/ publications/ tccs-13/
        ruff check src/ tests/ examples/ publications/ tccs-13/
        mypy --ignore-missing-imports src/ tests/ examples/ publications/ tccs-13/
      
    - name: Run the tests
      run: |
        pytest --cov=expreccs --cov-report term-missing --basetemp=test_outputs tests/ --exitfirst
        
    - name: Build documentation
      run: |
        pushd docs
        make html SPHINXOPTS="-W"
